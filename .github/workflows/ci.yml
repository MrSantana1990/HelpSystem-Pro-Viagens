name: Quality
on:
  push:
    branches: [main, develop, 'feature/**', 'agent/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Dependency security
        run: npm audit --audit-level=high
      - name: Browser runtime
        run: npx playwright install --with-deps chromium
      - name: Isolated runtime, ownership, browser and backup/restore
        run: npm run test:system
      - uses: actions/upload-artifact@v4
        with:
          name: viagens-web-${{ github.sha }}
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence-${{ github.sha }}
          path: |
            .runtime/restore-evidence.json
            .runtime/identity-*.png
  deploy:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && vars.DEPLOY_ENABLED == 'true' && vars.PERSISTENCE_DEPLOY_READY == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    secrets: inherit
