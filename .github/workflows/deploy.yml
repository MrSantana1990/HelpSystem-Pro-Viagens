name: Deploy private staging
on:
  workflow_call:
    inputs:
      image-artifact:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: viagens-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image-artifact }}
          path: .runtime
      - name: Deploy verified commit through restricted identity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/viagens_staging
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/viagens_known_hosts
          chmod 600 ~/.ssh/viagens_staging ~/.ssh/viagens_known_hosts
          bash infra/deploy.sh staging "$REVISION" .runtime/release.tar
      - name: Remove runner identity
        if: always()
        run: rm -f ~/.ssh/viagens_staging ~/.ssh/viagens_known_hosts
