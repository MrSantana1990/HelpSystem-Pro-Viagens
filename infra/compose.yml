name: ${COMPOSE_PROJECT_NAME:-viagens-local}
x-runtime: &runtime
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }
services:
  postgres:
    <<: *runtime
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viagens
      POSTGRES_USER: viagens_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run local:setup}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Run npm run local:setup}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Run npm run local:setup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backup_data:/backups
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
      - ./backup.sh:/operations/backup.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U viagens_admin -d viagens']
      interval: 5s
      timeout: 5s
      retries: 15
    mem_limit: 512m
    networks: [private]
  migrate:
    profiles: [tools]
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: ['node', 'dist/packages/database/src/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgresql://viagens_migrator:${MIGRATION_PASSWORD}@postgres:5432/viagens
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
  api:
    <<: *runtime
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      APP_ENV: ${APP_ENV:-local}
      PROVIDER_MODE: demo
      DATABASE_URL: postgresql://viagens_runtime:${RUNTIME_PASSWORD}@postgres:5432/viagens
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8094,http://127.0.0.1:8094}
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    networks: [private]
  web:
    <<: *runtime
    build: { context: .., dockerfile: infra/Dockerfile.web }
    ports: ['127.0.0.1:${WEB_PORT:-8094}:8080']
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    networks: [private, edge]
  redis:
    <<: *runtime
    profiles: [future-redis]
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      [
        sh,
        -ec,
        'test -n "$$REDIS_PASSWORD"; exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 96mb --maxmemory-policy allkeys-lru',
      ]
    mem_limit: 128m
    networks: [private]
networks:
  private: { internal: true }
  edge: {}
volumes:
  postgres_data: {}
  backup_data: {}
